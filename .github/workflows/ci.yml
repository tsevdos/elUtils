name: CI
on: [push, pull_request]

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, "latest"]
    name: Checking code changes in node version ➡️ ${{ matrix.node }} 💻
    steps:
      - name: Checkout code 📥
        uses: actions/checkout@v4

      - name: Install node 💻
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies 🔥
        run: npm i

      - name: Check app types, lint, format, and test 🙏
        run: npm run check

      - name: Build app 👷
        run: npm run build

  node-runtime-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [18, 20]
    name: Checking built package in node version ➡️ ${{ matrix.node }} 💻
    steps:
      - name: Checkout code 📥
        uses: actions/checkout@v4

      - name: Install build node 💻
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies 🔥
        run: npm ci

      - name: Build app 👷
        run: npm run build

      - name: Install runtime node 💻
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check CommonJS and ESM packages
        run: |
          node -e "const assert = require('node:assert/strict'); assert.equal(require('./dist/index.cjs').getDays({ locale: 'en' }).length, 7)"
          node --input-type=module -e "import assert from 'node:assert/strict'; import { getDays } from './dist/index.mjs'; assert.equal(getDays({ locale: 'en' }).length, 7)"

  bun-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: ["latest"]
    name: Checking code changes in bun version ➡️ ${{ matrix.bun }} 🍙
    steps:
      - name: Checkout code 📥
        uses: actions/checkout@v4

      - name: Install bun 🍙
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies 🔥
        run: bun install

      - name: Check app types, lint, format, and test 🙏
        run: npm run check

      - name: Build app 👷
        run: bun run build

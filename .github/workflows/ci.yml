name: CI
on: [push, pull_request]

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26, "latest"]
    name: Checking code changes in node version ➡️ ${{ matrix.node }} 💻
    steps:
      - name: Checkout code 📥
        uses: actions/checkout@v4

      - name: Install node 💻
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies 🔥
        run: npm ci --ignore-scripts

      - name: Check app types, lint, format, and test 🙏
        run: npm run check

      - name: Build app 👷
        run: npm run build

  bun-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: ["latest"]
    name: Checking code changes in bun version ➡️ ${{ matrix.bun }} 🍙
    steps:
      - name: Checkout code 📥
        uses: actions/checkout@v4

      - name: Install bun 🍙
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies 🔥
        run: bun install

      - name: Check app types, lint, format, and test 🙏
        run: npm run check

      - name: Build app 👷
        run: bun run build
